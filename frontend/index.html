<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>AI Content Studio</h1>
    <p>Create scripts for Shorts, Reels and YouTube videos.</p>

    <input id="topic" placeholder="Enter your video topic">
    <select id="language">
      <option>English</option>
      <option>Urdu</option>
      <option>Roman Urdu</option>
    </select>
    <input id="duration" type="number" value="60" min="15" max="600">

    <button id="generate-btn" type="button">Generate Script</button>

    <pre id="result" aria-live="polite">Your generated script will appear here...</pre>
    <div class="result-actions">
      <span id="source-badge"></span>
      <button id="copy-btn" type="button" class="secondary" hidden>Copy script</button>
    </div>
  </main>

<script>
const API_URL = "http://127.0.0.1:8000/generate-script";

const topicInput = document.getElementById("topic");
const languageSelect = document.getElementById("language");
const durationInput = document.getElementById("duration");
const resultEl = document.getElementById("result");
const generateBtn = document.getElementById("generate-btn");
const sourceBadge = document.getElementById("source-badge");
const copyBtn = document.getElementById("copy-btn");

function extractErrorMessage(data) {
  if (Array.isArray(data?.detail)) {
    return data.detail.map((d) => d.msg).join(", ");
  }
  return data?.detail || data?.error || "Something went wrong.";
}

function setBadge(source) {
  if (source === "ai") {
    sourceBadge.textContent = "⚡ Generated by AI";
    sourceBadge.className = "badge badge-ai";
  } else if (source === "template") {
    sourceBadge.textContent = "📄 Template mode — add OPENAI_API_KEY in backend/.env for real AI output";
    sourceBadge.className = "badge badge-template";
  } else {
    sourceBadge.textContent = "";
    sourceBadge.className = "badge";
  }
}

async function generateScript() {
  const topic = topicInput.value.trim();
  const language = languageSelect.value;
  const duration = Number(durationInput.value);

  if (!topic) {
    resultEl.textContent = "Please enter a topic first.";
    topicInput.focus();
    return;
  }

  generateBtn.disabled = true;
  resultEl.textContent = "Generating...";
  setBadge(null);
  copyBtn.hidden = true;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic, language, duration })
    });

    const data = await response.json();

    if (response.ok) {
      resultEl.textContent = data.script;
      setBadge(data.source);
      copyBtn.hidden = false;
    } else {
      resultEl.textContent = extractErrorMessage(data);
    }
  } catch (error) {
    resultEl.textContent = "Backend is not running. Start FastAPI first.";
  } finally {
    generateBtn.disabled = false;
  }
}

async function copyScript() {
  try {
    await navigator.clipboard.writeText(resultEl.textContent);
    const original = copyBtn.textContent;
    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = original), 1500);
  } catch (error) {
    copyBtn.textContent = "Copy failed";
  }
}

generateBtn.addEventListener("click", generateScript);
copyBtn.addEventListener("click", copyScript);
topicInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") generateScript();
});
</script>
</body>
</html>
