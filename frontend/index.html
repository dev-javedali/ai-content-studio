<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>AI Content Studio</h1>
    <p>Create scripts for Shorts, Reels and YouTube videos.</p>

    <input id="topic" placeholder="Enter your video topic">
    <select id="language">
      <option>English</option>
      <option>Urdu</option>
      <option>Roman Urdu</option>
    </select>
    <input id="duration" type="number" value="60" min="15" max="600">

    <button id="generate-btn" type="button">Generate Script</button>

    <pre id="result" aria-live="polite">Your generated script will appear here...</pre>
  </main>

<script>
const API_URL = "http://127.0.0.1:8000/generate-script";

const topicInput = document.getElementById("topic");
const languageSelect = document.getElementById("language");
const durationInput = document.getElementById("duration");
const resultEl = document.getElementById("result");
const generateBtn = document.getElementById("generate-btn");

function extractErrorMessage(data) {
  if (Array.isArray(data?.detail)) {
    return data.detail.map((d) => d.msg).join(", ");
  }
  return data?.detail || data?.error || "Something went wrong.";
}

async function generateScript() {
  const topic = topicInput.value.trim();
  const language = languageSelect.value;
  const duration = Number(durationInput.value);

  if (!topic) {
    resultEl.textContent = "Please enter a topic first.";
    topicInput.focus();
    return;
  }

  generateBtn.disabled = true;
  resultEl.textContent = "Generating...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic, language, duration })
    });

    const data = await response.json();
    resultEl.textContent = response.ok
      ? data.script
      : extractErrorMessage(data);
  } catch (error) {
    resultEl.textContent = "Backend is not running. Start FastAPI first.";
  } finally {
    generateBtn.disabled = false;
  }
}

generateBtn.addEventListener("click", generateScript);
topicInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") generateScript();
});
</script>
</body>
</html>
